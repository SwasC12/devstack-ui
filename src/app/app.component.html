<div class="shell">
  <header class="top-bar">
    <a class="brand" routerLink="/">
      <span class="logo">☕</span>
      <span>The Daily Grind</span>
    </a>
    <nav class="nav-links">
      <a routerLink="/menu" routerLinkActive="active">Menu</a>
      @if (auth.isLoggedIn) {
        <a routerLink="/pos" routerLinkActive="active">POS</a>
        @if (isAdmin) {
          <a routerLink="/admin" routerLinkActive="active">Admin</a>
          <button class="nav-btn" (click)="logout()">Logout</button>
        }
      }
    </nav>
  </header>
  <main class="main">
    <router-outlet />
  </main>
</div>
