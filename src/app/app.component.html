<div class="shell">
  <header class="top-bar">
    <a class="brand" routerLink="/">
      <img src="/favicon.png" alt="" class="logo-img" />
      <span>CoffeeShop Pro</span>
    </a>
    <nav class="nav-links">
      <a routerLink="/menu" routerLinkActive="active">Menu</a>
      @if (auth.isLoggedIn) {
        @if (shop) { <span class="shop-badge">{{ shop.name }}</span> }
        <a routerLink="/pos" routerLinkActive="active">POS</a>
        @if (isAdmin) {
          <a routerLink="/admin" routerLinkActive="active">Admin</a>
        }
        @if (isSuperAdmin) {
          <a routerLink="/shops" routerLinkActive="active">Shops</a>
        }
        <button class="nav-btn" (click)="logout()">Logout</button>
      }
    </nav>
  </header>
  <main class="main">
    <router-outlet />
  </main>
</div>
